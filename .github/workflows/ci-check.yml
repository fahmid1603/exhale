name: ci-check
on: { push: { branches: [ci-check] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleUniversalDebug
      - uses: actions/upload-artifact@v4
        with: { name: exhale-debug, path: app/build/outputs/apk/**/*.apk }
