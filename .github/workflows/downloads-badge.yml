name: Update downloads badge

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate release downloads
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '[.[].assets[] | .download_count] | add // 0')
          formatted=$(printf '%s' "$total" | rev | sed 's/[0-9][0-9][0-9]/&,/g' | rev | sed 's/^,//')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "formatted=$formatted" >> "$GITHUB_OUTPUT"

      - name: Render badge
        env:
          DOWNLOADS: ${{ steps.count.outputs.formatted }}
          TOTAL: ${{ steps.count.outputs.total }}
        run: |
          cat > assets/downloads.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="132" height="20" role="img" aria-label="Total downloads: $DOWNLOADS">
            <title>Total downloads: $DOWNLOADS</title>
            <rect width="96" height="20" fill="#555"/>
            <rect x="96" width="36" height="20" fill="#2EA44F"/>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="48" y="14">downloads</text>
              <text x="114" y="14">$DOWNLOADS</text>
            </g>
          </svg>
          SVG

      - name: Publish badge when changed
        run: |
          if git diff --quiet -- assets/downloads.svg; then
            echo "Downloads unchanged at ${{ steps.count.outputs.formatted }}"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/downloads.svg
          git commit -m "chore: update downloads badge"
          git push
